<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b282c"/>
      <stop offset="100%" stop-color="#064e52"/>
    </linearGradient>
    <linearGradient id="veinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#14b8a6" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Stylized Vascular Vein Tree / Leg Contour Symbol -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Main saphenous vein trunk -->
    <path d="M0, 160 C-10, 100 -25, 40 -15, -20 C-5, -80 15, -120 0, -170" fill="none" stroke="url(#veinGrad)" stroke-width="22" stroke-linecap="round"/>
    
    <!-- Tributary veins -->
    <path d="M-15, 60 C-45, 40 -70, 70 -95, 65" fill="none" stroke="url(#veinGrad)" stroke-width="14" stroke-linecap="round"/>
    <path d="M-18, -10 C-50, -35 -85, -25 -110, -50" fill="none" stroke="url(#veinGrad)" stroke-width="12" stroke-linecap="round"/>
    <path d="M3, 10 C35, -5 65, 20 95, 5" fill="none" stroke="url(#veinGrad)" stroke-width="14" stroke-linecap="round"/>
    <path d="M-2, -90 C30, -110 65, -95 90, -125" fill="none" stroke="url(#veinGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Medical cross crest overlay in top right -->
    <g transform="translate(85, -85) scale(0.65)">
      <circle cx="0" cy="0" r="48" fill="#082024" stroke="#22d3ee" stroke-width="6"/>
      <path d="M-20,0 L20,0 M0,-20 L0,20" stroke="#22d3ee" stroke-width="10" stroke-linecap="round"/>
    </g>

    <!-- Laser / Ultrasound treatment beacon pulse rings -->
    <circle cx="-15" cy="-20" r="16" fill="#22d3ee" opacity="0.9"/>
    <circle cx="-15" cy="-20" r="28" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.6"/>
  </g>
</svg>
